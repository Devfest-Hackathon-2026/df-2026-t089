<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelf Training Data</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2228; --muted: #687280; --line: #e3e6ea;
    --accent: #2f6fdb; --accent-soft: #e4edfb; --warn: #b4540a; --warn-soft: #fdf0e3; --cut: #e5322d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171b; --panel: #1d2127; --text: #e6e9ed; --muted: #949ca7; --line: #2d333b;
      --accent: #6b9ff0; --accent-soft: #22324a; --warn: #f0a35b; --warn-soft: #3a2a1a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  header { padding: 20px 24px 8px; }
  h1 { margin: 0; font-size: 20px; }
  .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  main { padding: 8px 24px 40px; display: grid; gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { margin: 0 0 12px; font-size: 15px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 12px; }
  .two { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
  .bars { display: grid; gap: 4px; }
  .bar { display: grid; grid-template-columns: 170px 1fr 40px; gap: 8px; align-items: center; cursor: pointer; border-radius: 6px; padding: 2px 4px; }
  .bar:hover, .bar.on { background: var(--accent-soft); }
  .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 12px; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
  .bar .fill.low { background: var(--warn); }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .issues { margin: 0; padding-left: 18px; }
  .issues li { margin-bottom: 6px; }
  .issues .files { color: var(--muted); font-size: 12px; word-break: break-all; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters select, .filters input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .filters label { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  .count { margin-left: auto; color: var(--muted); }
  .grid { display: grid; align-items: start; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .frame { position: relative; background: var(--line); }
  .frame img { width: 100%; height: auto; display: block; }
  .cut { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--cut); box-shadow: 0 0 0 1px #fff8; }
  .meta { padding: 6px 8px; font-size: 12px; }
  .meta .lbl { font-weight: 600; }
  .meta .lbl.none { color: var(--warn); }
  .meta .fn { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; }
  dialog { border: none; border-radius: 12px; padding: 0; background: var(--panel); color: var(--text); max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: #000a; }
  .big { position: relative; width: fit-content; margin: 0 auto; }
  .big img { max-height: 82vh; max-width: 92vw; display: block; }
  .big .cut { width: 3px; }
  .dlg-meta { padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .dlg-meta button { margin-left: auto; font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  .hint { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  nav button { font: inherit; background: none; border: none; color: var(--muted); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab[hidden] { display: none; }
  .note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.hl td { background: var(--accent-soft); }
  .ok { color: #1f8a4c; font-weight: 600; } .ng { color: var(--cut); font-weight: 600; }
  .pcut { position: absolute; top: 0; bottom: 0; width: 0; margin-left: -1px; border-left: 2px dashed #35a2ff; }
  .strip { display: grid; grid-template-columns: repeat(24, 1fr); height: 10px; }
  .strip i { background: #35a2ff; }
  .top3 { font-size: 11px; color: var(--muted); }
  .legend-line { display: inline-block; width: 18px; vertical-align: middle; margin: 0 4px 0 10px; }
  .rv { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .rv { grid-template-columns: 1fr; } }
  .rv-img { display: flex; justify-content: center; }
  .rv-img .big img { max-height: 75vh; }
  .rv-cur { font-size: 22px; font-weight: 700; margin: 4px 0; }
  .rv-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 12px 0; }
  .rv button, #rvSearch { font: inherit; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
  .rv button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .rv button:focus-visible, #rvSearch:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #rvSearch { width: 100%; cursor: text; }
  .rv-classes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .rv-classes button { padding: 5px 9px; font-size: 13px; }
  .rv-classes button.cur { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .rv-ex { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 4px; }
  .rv-ex img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; }
  kbd { font-size: 11px; opacity: 0.75; border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; margin-left: 4px; }
  .st-ok { color: #1f8a4c; } .st-fixed { color: var(--accent); } .st-excluded { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>棚の学習データ</h1>
  <div class="sub" id="dataDir">読み込み中…</div>
</header>
<nav>
  <button data-tab="data" class="on">データ</button>
  <button data-tab="eval">モデル評価</button>
  <button data-tab="unit">ユニットテスト</button>
  <button data-tab="train">学習の進捗</button>
  <button data-tab="review">ラベル修正</button>
</nav>
<main class="tab" id="tab-review" hidden>
  <div class="panel filters">
    <select id="rvFilter"></select>
    <span class="hint" id="rvStats"></span>
    <span class="count" id="rvPos"></span>
  </div>
  <div class="rv">
    <div class="panel rv-img"><div class="big" id="rvBig"></div></div>
    <div class="panel rv-side">
      <div class="hint" id="rvFile"></div>
      <div class="rv-cur" id="rvCur"></div>
      <div id="rvInfo" class="hint"></div>
      <div class="rv-actions">
        <button id="rvOk" class="primary">✓ このままでOK <kbd>Enter</kbd></button>
        <button id="rvEx">除外 <kbd>X</kbd></button>
        <button id="rvPrev">← 前</button>
        <button id="rvNext">次 →</button>
      </div>
      <input id="rvSearch" type="search" placeholder="クラスを検索して変更（/ でフォーカス、Enter で先頭を選択）">
      <div class="rv-classes" id="rvClasses"></div>
      <div class="hint" style="margin-top:12px">このクラスの他の画像（見比べ用）</div>
      <div class="rv-ex" id="rvEx2"></div>
    </div>
  </div>
</main>
<main class="tab" id="tab-train" hidden></main>
<main class="tab" id="tab-eval" hidden></main>
<main class="tab" id="tab-unit" hidden></main>
<main class="tab" id="tab-data">
  <section class="tiles" id="tiles"></section>
  <section class="two">
    <div class="panel">
      <h2>クラス別の枚数 <span class="hint">（クリックで絞り込み・オレンジは10枚未満）</span></h2>
      <div class="bars" id="bars"></div>
    </div>
    <div class="panel">
      <h2>データの問題点</h2>
      <ul class="issues" id="issues"></ul>
    </div>
  </section>
  <section class="panel">
    <div class="filters">
      <select id="fClass"><option value="">すべてのクラス</option></select>
      <select id="fBnd">
        <option value="">境界：すべて</option>
        <option value="has">境界アノテあり</option>
        <option value="cuts">境界線あり（1本以上）</option>
        <option value="none">境界アノテなし</option>
      </select>
      <input id="fText" type="search" placeholder="ファイル名で検索">
      <label><input id="fUnl" type="checkbox"> 未ラベルのみ</label>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<dialog id="dlg">
  <div class="big" id="big"></div>
  <div class="dlg-meta" id="dlgMeta"></div>
</dialog>
<script>
const $ = id => document.getElementById(id);
let D, imgs = [], shown = [];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cutsHtml = cuts => (cuts || []).map(c => `<div class="cut" style="left:${c * 100}%"></div>`).join('');

fetch('/api/data').then(r => r.json()).then(d => { D = d; imgs = d.images; init(); });

function init() {
  $('dataDir').textContent = D.dataDir;
  const labeled = imgs.filter(i => i.label), bnd = imgs.filter(i => i.cuts);
  const counts = {};
  labeled.forEach(i => counts[i.label] = (counts[i.label] || 0) + 1);
  const classes = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const nCuts = bnd.reduce((s, i) => s + i.cuts.length, 0);
  $('tiles').innerHTML = [
    [imgs.length, '画像'], [labeled.length, 'ラベル付き'], [classes.length, 'クラス'],
    [bnd.length, '境界アノテ画像'], [nCuts, '境界線の本数'], [imgs.length - labeled.length, '未ラベル'],
  ].map(([n, t]) => `<div class="tile"><b>${n}</b><span>${t}</span></div>`).join('');

  const max = Math.max(...Object.values(counts));
  $('bars').innerHTML = classes.map(c => `<div class="bar" data-c="${esc(c)}" title="${esc(c)}: ${counts[c]}枚">
      <span class="name">${esc(c)}</span>
      <span class="track"><div class="fill ${counts[c] < 10 ? 'low' : ''}" style="width:${counts[c] / max * 100}%"></div></span>
      <span class="n">${counts[c]}</span></div>`).join('');
  $('bars').onclick = e => { const b = e.target.closest('.bar'); if (!b) return;
    $('fClass').value = $('fClass').value === b.dataset.c ? '' : b.dataset.c; render(); };
  const keepC = $('fClass').value;
  $('fClass').innerHTML = '<option value="">すべてのクラス</option>' + classes.map(c => `<option>${esc(c)}</option>`).join('');
  $('fClass').value = keepC;

  const issues = [];
  const unl = imgs.filter(i => !i.label);
  if (unl.length) issues.push([`未ラベルの画像 ${unl.length}枚`, unl.map(i => i.file)]);
  if (D.missingFiles.length) issues.push([`CSVにあるが画像が無い ${D.missingFiles.length}件`, D.missingFiles]);
  const low = classes.filter(c => counts[c] < 10);
  if (low.length) issues.push([`10枚未満のクラス ${low.length}個`, low.map(c => `${c}(${counts[c]})`)]);
  const bndNoLabel = bnd.filter(i => !i.label);
  if (bndNoLabel.length) issues.push([`境界アノテありでクラス無し ${bndNoLabel.length}枚`, bndNoLabel.map(i => i.file)]);
  if (D.modelClasses.length) {
    const a = D.modelClasses.filter(c => !counts[c]), b = classes.filter(c => !D.modelClasses.includes(c));
    if (a.length || b.length) issues.push(['アプリ内モデルのクラスとデータが不一致（要再学習）', [...a.map(c => '−' + c), ...b.map(c => '+' + c)]]);
  }
  issues.push([`境界アノテは ${bnd.length}枚のみ（学習には100枚以上が目安）`, []]);
  $('issues').innerHTML = issues.map(([t, f]) => `<li>${esc(t)}${f.length ? `<div class="files">${f.slice(0, 30).map(esc).join(', ')}${f.length > 30 ? ' …' : ''}</div>` : ''}</li>`).join('');

  ['fClass', 'fBnd', 'fUnl'].forEach(id => $(id).onchange = render);
  $('fText').oninput = render;
  render();
}

function render() {
  const c = $('fClass').value, b = $('fBnd').value, t = $('fText').value.trim().toLowerCase(), u = $('fUnl').checked;
  shown = imgs.filter(i => (!c || i.label === c) && (!u || !i.label) && (!t || i.file.toLowerCase().includes(t))
    && (!b || (b === 'has' ? i.cuts : b === 'cuts' ? i.cuts && i.cuts.length : !i.cuts)));
  document.querySelectorAll('.bar').forEach(el => el.classList.toggle('on', el.dataset.c === c));
  $('count').textContent = `${shown.length} / ${imgs.length} 枚`;
  $('grid').innerHTML = shown.map((i, k) => `<div class="card" data-k="${k}">
      <div class="frame"><img loading="lazy" src="/thumb/${encodeURIComponent(i.file)}" alt="${esc(i.file)}">${cutsHtml(i.cuts)}</div>
      <div class="meta"><div class="lbl ${i.label ? '' : 'none'}">${esc(i.label || '未ラベル')}${i.cuts ? `<span class="chip">境界 ${i.cuts.length}</span>` : ''}</div>
      <div class="fn">${esc(i.file)}</div></div></div>`).join('');
}

$('grid').onclick = e => { const card = e.target.closest('.card'); if (card) open(+card.dataset.k); };
let cur = 0;
function open(k) {
  cur = k; const i = shown[k];
  $('big').innerHTML = `<img src="/img/${encodeURIComponent(i.file)}" alt="${esc(i.file)}">${cutsHtml(i.cuts)}`;
  $('dlgMeta').innerHTML = `<b>${esc(i.label || '未ラベル')}</b><span>${esc(i.file)}</span>
    <span class="hint">${i.cuts ? '境界: ' + (i.cuts.join(', ') || 'なし（境界が無いと明示）') : '境界アノテなし'}　← → で移動</span>
    <button onclick="dlg.close()">閉じる</button>`;
  if (!$('dlg').open) $('dlg').showModal();
}
document.addEventListener('keydown', e => {
  if (!$('dlg').open) return;
  if (e.key === 'ArrowRight' && cur < shown.length - 1) open(cur + 1);
  if (e.key === 'ArrowLeft' && cur > 0) open(cur - 1);
});
$('dlg').onclick = e => { if (e.target === $('dlg')) $('dlg').close(); };

// ---------- tabs ----------
function showTab(t) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.tab').forEach(m => m.hidden = m.id !== 'tab-' + t);
  history.replaceState(null, '', '#' + t);
  clearInterval(pollTimer);
  if (t === 'train') { loadProgress(); pollTimer = setInterval(loadProgress, 3000); }
  else if (t === 'review') whenData(initReview);
  else if (t === 'data') { if (D) { init(); } }
  else loadResults();
}
let pollTimer;
const whenData = f => D ? f() : setTimeout(() => whenData(f), 100);
document.querySelector('nav').onclick = e => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); };

// ---------- label review ----------
const ST = { ok: '確認済み', fixed: '修正済み', excluded: '除外' };
let rvQueue = [], rvPos = 0, rvReady = false, evalPred = {};

function initReview() {
  if (!rvReady) {
    rvReady = true;
    fetch('/api/results').then(r => r.json()).then(R => {
      (R.eval?.classifier?.val || []).forEach(v => evalPred[v.file] = v.top);
      const n = Object.entries(evalPred).filter(([f, t]) => imgs.find(i => i.file === f)?.label !== t[0][0]).length;
      $('rvFilter').querySelector('[value="evalwrong"]').textContent = `モデル評価で外れた画像（${n}）`;
      if (D) showReview();
    });
    $('rvOk').onclick = () => { const i = rvCur(); if (!i) return; if (i.label) setLabel(i.label); else $('rvSearch').focus(); }; // unlabeled: pick a class first
    $('rvEx').onclick = () => setLabel(null);
    $('rvPrev').onclick = () => move(-1);
    $('rvNext').onclick = () => move(1);
    $('rvFilter').onchange = () => { buildQueue(); showReview(); };
    $('rvSearch').oninput = drawClasses;
    $('rvSearch').onkeydown = e => {
      if (e.key === 'Enter') { e.preventDefault(); const q = $('rvSearch').value.trim(); const m = classList().filter(c => c.includes(q));
        if (q) setLabel(m[0] || q); }
      if (e.key === 'Escape') { $('rvSearch').value = ''; $('rvSearch').blur(); drawClasses(); }
    };
    document.addEventListener('keydown', e => {
      if ($('tab-review').hidden || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || $('dlg').open) return;
      if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); $('rvOk').click(); }
      else if (e.key === 'x' || e.key === 'X') $('rvEx').click();
      else if (e.key === 'ArrowRight') move(1);
      else if (e.key === 'ArrowLeft') move(-1);
      else if (e.key === '/') { e.preventDefault(); $('rvSearch').focus(); }
    });
  }
  const counts = labelCounts();
  const prev = $('rvFilter').value || 'todo';
  $('rvFilter').innerHTML = [['todo', '未確認'], ['all', 'すべて'], ['unlabeled', '未ラベル'], ['fixed', '修正済み'], ['excluded', '除外'],
    ['evalwrong', 'モデル評価で外れた画像']].map(([v, t]) => `<option value="${v}">${t}</option>`).join('')
    + Object.keys(counts).sort((a, b) => counts[b] - counts[a]).map(c => `<option value="c:${esc(c)}">クラス: ${esc(c)}（${counts[c]}）</option>`).join('');
  $('rvFilter').value = [...$('rvFilter').options].some(o => o.value === prev) ? prev : 'todo';
  buildQueue(); showReview();
}

const labelCounts = () => imgs.reduce((m, i) => (i.label && (m[i.label] = (m[i.label] || 0) + 1), m), {});
function classList() {
  const c = labelCounts();
  return [...new Set([...Object.keys(c), ...D.modelClasses])].sort((a, b) => (c[b] || 0) - (c[a] || 0));
}
function buildQueue() {
  const f = $('rvFilter').value;
  const keep = {
    todo: i => !i.review, all: () => true, unlabeled: i => !i.label && i.review?.status !== 'excluded',
    fixed: i => i.review?.status === 'fixed', excluded: i => i.review?.status === 'excluded',
    evalwrong: i => evalPred[i.file] && evalPred[i.file][0][0] !== (i.review?.original || i.label),
  }[f] || (i => i.label === f.slice(2));
  // grouped by class so a wrong one stands out against its neighbours
  rvQueue = imgs.filter(keep).sort((a, b) => (a.label || '').localeCompare(b.label || '') || a.file.localeCompare(b.file));
  rvPos = 0;
}
const rvCur = () => rvQueue[rvPos];
function move(d) { rvPos = Math.min(Math.max(rvPos + d, 0), Math.max(rvQueue.length - 1, 0)); showReview(); }

function showReview() {
  const done = imgs.filter(i => i.review), fx = done.filter(i => i.review.status === 'fixed').length, ex = done.filter(i => i.review.status === 'excluded').length;
  $('rvStats').textContent = `確認済み ${done.length} / ${imgs.length}（修正 ${fx}・除外 ${ex}）`;
  const i = rvCur();
  $('rvPos').textContent = rvQueue.length ? `${rvPos + 1} / ${rvQueue.length}` : '';
  if (!i) {
    $('rvBig').innerHTML = '<p class="note" style="padding:40px">この条件の画像はありません。上の絞り込みを変えてください。</p>';
    ['rvFile', 'rvCur', 'rvInfo', 'rvClasses', 'rvEx2'].forEach(id => $(id).innerHTML = '');
    return;
  }
  $('rvBig').innerHTML = `<img src="/img/${encodeURIComponent(i.file)}" alt="${esc(i.file)}">${cutsHtml(i.cuts)}`;
  const nx = rvQueue[rvPos + 1]; if (nx) new Image().src = `/img/${encodeURIComponent(nx.file)}`; // prefetch
  $('rvFile').textContent = i.file;
  $('rvCur').innerHTML = i.review?.status === 'excluded' ? '<span class="st-excluded">除外</span>' : esc(i.label || '未ラベル');
  const info = [];
  if (i.review) info.push(`<span class="st-${i.review.status}">${ST[i.review.status]}</span>（${esc(i.review.at.replace('T', ' '))}）`);
  if (i.review && i.review.original !== (i.label || '')) info.push(`元のラベル：${esc(i.review.original || '未ラベル')}`);
  if (evalPred[i.file]) info.push(`モデル予測：${evalPred[i.file].map(t => `${esc(t[0])} ${pct(t[1])}`).join(' / ')}`);
  $('rvInfo').innerHTML = info.join('<br>');
  drawClasses();
  const same = imgs.filter(o => i.label && o.label === i.label && o.file !== i.file).sort((a, b) => (b.review?.status === 'ok') - (a.review?.status === 'ok')).slice(0, 10);
  $('rvEx2').innerHTML = same.map(o => `<img loading="lazy" src="${thumb(o.file)}" alt="${esc(o.file)}" title="${esc(o.file)}">`).join('');
}

function drawClasses() {
  const i = rvCur(); if (!i) return;
  const q = $('rvSearch').value.trim(), list = classList().filter(c => !q || c.includes(q));
  $('rvClasses').innerHTML = list.map(c => `<button class="${c === i.label ? 'cur' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')
    + (q && !list.includes(q) ? `<button data-c="${esc(q)}">＋「${esc(q)}」を新しいクラスにする</button>` : '');
  $('rvClasses').onclick = e => { const b = e.target.closest('button'); if (b) setLabel(b.dataset.c); };
}

function setLabel(label) {
  const i = rvCur(); if (!i) return;
  fetch('/api/label', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file: i.file, label }) })
    .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e.error)))
    .then(rev => {
      i.review = rev; i.label = label;
      $('rvSearch').value = '';
      if (rvPos < rvQueue.length - 1) rvPos++;
      showReview();
    })
    .catch(err => alert('保存に失敗しました: ' + err));
}

// ---------- training progress ----------
const dur = s => s < 60 ? `${Math.round(s)}秒` : s < 3600 ? `${Math.floor(s / 60)}分${Math.round(s % 60)}秒` : `${Math.floor(s / 3600)}時間${Math.round(s % 3600 / 60)}分`;
const clock = t => new Date(t * 1000).toLocaleTimeString('ja-JP');

function loadProgress() {
  fetch('/api/progress').then(r => r.json()).then(({ now, progress: P }) => renderProgress(P, now));
}

function chart(rows, key, label) {
  const pts = rows.filter(r => r[key] != null);
  if (pts.length < 1) return '';
  const W = 260, H = 80, vals = pts.map(r => r[key]);
  const isAcc = key.includes('accuracy'), lo = isAcc ? 0 : Math.min(...vals), hi = isAcc ? 1 : Math.max(...vals);
  const n = Math.max(rows.length, 2) - 1;
  const xy = pts.map((r, i) => [6 + (r.epoch - rows[0].epoch) / (n || 1) * (W - 12), H - 6 - (r[key] - lo) / ((hi - lo) || 1) * (H - 12)]);
  const last = vals[vals.length - 1];
  return `<div><div class="hint">${label}　最新 <b style="color:var(--text)">${isAcc ? pct(last) : last.toFixed(3)}</b></div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="background:var(--bg);border-radius:6px" role="img" aria-label="${label}の推移">
      <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${xy.map(p => p.join(',')).join(' ')}"/>
      ${xy.length ? `<circle cx="${xy.at(-1)[0]}" cy="${xy.at(-1)[1]}" r="3" fill="var(--accent)"/>` : ''}
    </svg></div>`;
}

function renderProgress(P, now) {
  const el = $('tab-train');
  if (!P) { el.innerHTML = `<div class="panel">まだ学習の記録がありません。<code>tools/.venv/Scripts/python tools/train.py</code> を実行するとここに進捗が出ます。</div>`; return; }
  const stale = P.status === 'running' && now - P.updated > 180;
  const status = stale ? ['応答なし（止まった可能性）', 'ng'] : { running: ['学習中', ''], done: ['完了', 'ok'], failed: ['失敗・中断', 'ng'] }[P.status];
  const pi = P.phases.indexOf(P.phase);
  const inPhase = P.epochs ? (P.epoch + (P.steps ? P.step / P.steps : 0)) / P.epochs : 0;
  const overall = P.status === 'done' ? 1 : pi < 0 ? 0 : (pi + inPhase) / P.phases.length;
  const phaseEl = P.phaseStarted ? now - P.phaseStarted : 0;
  const eta = P.status === 'running' && !stale && inPhase > 0.02 ? phaseEl / inPhase * (1 - inPhase) : null;
  const bar = f => `<div style="height:10px;background:var(--bg);border-radius:5px;overflow:hidden"><div style="height:100%;width:${f * 100}%;background:var(--accent)"></div></div>`;
  el.innerHTML = `<section class="tiles">
      <div class="tile"><b class="${status[1]}" style="font-size:18px">${status[0]}</b><span>状態（${P.args || '引数なし'}）</span></div>
      <div class="tile"><b>${pct(overall)}</b><span>全体の進捗</span></div>
      <div class="tile"><b style="font-size:18px">${esc(P.phase || '-')}</b><span>段階 ${pi + 1}/${P.phases.length}</span></div>
      <div class="tile"><b>${P.epoch}/${P.epochs}</b><span>エポック（${P.step}/${P.steps} ステップ）</span></div>
      <div class="tile"><b style="font-size:18px">${eta != null ? '約' + dur(eta) : '-'}</b><span>この段階の残り時間</span></div>
      <div class="tile"><b style="font-size:18px">${dur((P.status === 'running' ? now : P.updated) - P.started)}</b><span>経過（開始 ${clock(P.started)}・更新 ${clock(P.updated)}）</span></div>
    </section>
    <div class="panel"><h2>段階</h2>
      ${P.phases.map((ph, i) => `<div style="display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin-bottom:6px">
        <span>${esc(ph)}</span>${bar(i < pi || P.status === 'done' ? 1 : i === pi ? inPhase : 0)}<span class="hint">${i < pi || P.status === 'done' ? '完了' : i === pi ? pct(inPhase) : '待ち'}</span></div>`).join('')}
      ${P.error ? `<pre class="hint" style="white-space:pre-wrap">${esc(P.error)}</pre>` : ''}
      <p class="note">3秒ごとに自動更新。棚種類は前半が最終層のみ、後半が微調整の2段階。</p></div>
    <section class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">
      ${Object.entries(P.history).filter(([, rows]) => rows.length).map(([ph, rows]) => `<div class="panel"><h2>${esc(ph)}</h2>
        ${chart(rows, 'loss', '損失（学習）')}${chart(rows, 'accuracy', '正解率（学習）')}${chart(rows, 'val_accuracy', '正解率（検証用）')}</div>`).join('')}
    </section>`;
}
const pct = x => (x * 100).toFixed(0) + '%';
const thumb = f => `/thumb/${encodeURIComponent(f)}`;

function loadResults() {
  fetch('/api/results').then(r => r.json()).then(R => { renderEval(R.eval); renderUnit(R.unit); });
}

function decodePeaks(p, thr) { // same as Analyzer.kt / train.py
  const out = [];
  p.forEach((v, i) => {
    const l = i > 0 ? p[i - 1] : 0, r = i < p.length - 1 ? p[i + 1] : 0;
    if (v >= thr && v >= l && v > r) { const d = l - 2 * v + r; out.push((i + 0.5 + (d < 0 ? 0.5 * (l - r) / d : 0)) / p.length); }
  });
  return out;
}

function renderEval(E) {
  const el = $('tab-eval');
  if (!E) { el.innerHTML = `<div class="panel">評価結果がありません。<code>tools/.venv/Scripts/python tools/train.py --eval-only</code> を実行すると <code>tools/results/eval.json</code> ができます。</div>`; return; }
  const C = E.classifier, B = E.boundary, h = [];
  const app = B && B.sweep.find(s => s.thr === B.appThreshold);
  h.push(`<p class="note">どちらも学習に使っていない検証用データ（ホールドアウト）での結果。アプリに入っている最終モデルは、この検証用データも含めた全データで学習し直したもの。</p>`);
  h.push(`<section class="tiles">${[
    C && [pct(C.accuracy), `棚種類 正解率（検証 ${C.val.length}枚）`],
    C && [pct(C.val.filter(r => r.top.some(t => t[0] === r.label)).length / C.val.length), '棚種類 上位3位以内の正解率'],
    app && [pct(app.precision), `境界 適合率（しきい値 ${B.appThreshold}）`],
    app && [pct(app.recall), `境界 再現率（検証 ${B.val.length}枚）`],
  ].filter(Boolean).map(([n, t]) => `<div class="tile"><b>${n}</b><span>${t}</span></div>`).join('')}</section>`);

  if (C) {
    const per = {};
    C.val.forEach(r => { const p = per[r.label] ||= [0, 0]; p[1]++; if (r.top[0][0] === r.label) p[0]++; });
    const rows = Object.entries(per).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]);
    const wrong = C.val.filter(r => r.top[0][0] !== r.label);
    h.push(`<section class="two"><div class="panel"><h2>棚種類：誤分類 ${wrong.length}件 <span class="hint">（${C.at}・${C.epochs}エポック・学習 ${C.train}枚）</span></h2>
      <label class="hint"><input type="checkbox" id="evAll"> 正解した画像も表示</label><div class="grid" id="evGrid"></div></div>
      <div class="panel"><h2>クラス別の正解数</h2><table><tr><th>クラス</th><th class="num">正解/件</th></tr>
      ${rows.map(([c, [ok, n]]) => `<tr><td>${esc(c)}</td><td class="num ${ok < n ? 'ng' : 'ok'}">${ok}/${n}</td></tr>`).join('')}</table>
      <p class="note">各クラス3件程度しかないので、1件の差で大きく変わる。</p></div></section>`);
    setTimeout(() => {
      const draw = () => {
        const list = $('evAll').checked ? C.val : wrong;
        $('evGrid').innerHTML = list.map(r => `<div class="card"><div class="frame"><img loading="lazy" src="${thumb(r.file)}" alt="${esc(r.file)}"></div>
          <div class="meta"><div>正解 <b>${esc(r.label)}</b></div>
          <div>予測 <b class="${r.top[0][0] === r.label ? 'ok' : 'ng'}">${esc(r.top[0][0])}</b></div>
          <div class="top3">${r.top.map(t => `${esc(t[0])} ${pct(t[1])}`).join(' / ')}</div>
          <div class="fn">${esc(r.file)}</div></div></div>`).join('') || '<p class="note">なし</p>';
      };
      $('evAll').onchange = draw; draw();
    });
  }
  if (B) {
    h.push(`<section class="two"><div class="panel"><h2>棚の境界：検証画像 <span class="hint">（${B.at}・学習 実画像${B.train}枚＋合成）</span></h2>
      <p class="note"><span class="legend-line" style="border-top:2px solid var(--cut)"></span>正解の境界
      <span class="legend-line" style="border-top:2px dashed #35a2ff"></span>予測（しきい値 ${B.appThreshold}）　下の帯＝列ごとの境界確率（濃いほど高い）</p>
      <div class="grid">${B.val.map(r => { const pred = decodePeaks(r.probs, B.appThreshold); return `<div class="card">
        <div class="frame"><img loading="lazy" src="${thumb(r.file)}" alt="${esc(r.file)}">${cutsHtml(r.cuts)}${pred.map(c => `<div class="pcut" style="left:${c * 100}%"></div>`).join('')}</div>
        <div class="strip">${r.probs.map(p => `<i style="opacity:${Math.max(p, 0.04)}" title="${p}"></i>`).join('')}</div>
        <div class="meta"><div>正解 ${r.cuts.length}本 / 予測 ${pred.length}本</div><div class="fn">${esc(r.file)}</div></div></div>`; }).join('')}</div></div>
      <div class="panel"><h2>しきい値ごとの精度</h2><table><tr><th>しきい値</th><th class="num">適合率</th><th class="num">再現率</th></tr>
      ${B.sweep.map(s => `<tr class="${s.thr === B.appThreshold ? 'hl' : ''}"><td>${s.thr}${s.thr === B.appThreshold ? '（アプリ）' : ''}</td><td class="num">${pct(s.precision)}</td><td class="num">${pct(s.recall)}</td></tr>`).join('')}</table>
      <p class="note">予測が正解から画像幅の ±${B.tolerance * 100}% 以内なら正解とみなす。検証は ${B.val.length}枚だけなので誤差が大きい。</p></div></section>`);
  }
  el.innerHTML = h.join('');
}

function renderUnit(U) {
  const t = U.tests, pass = t.filter(x => x.status === 'passed').length, fail = t.filter(x => x.status === 'failed').length;
  $('tab-unit').innerHTML = t.length ? `<section class="tiles">
      <div class="tile"><b>${t.length}</b><span>テスト</span></div>
      <div class="tile"><b class="ok">${pass}</b><span>成功</span></div>
      <div class="tile"><b class="${fail ? 'ng' : ''}">${fail}</b><span>失敗</span></div>
      <div class="tile"><b style="font-size:15px">${U.at}</b><span>最終実行</span></div></section>
    <div class="panel"><table><tr><th>結果</th><th>クラス</th><th>テスト</th><th class="num">秒</th></tr>
    ${t.map(x => `<tr><td class="${x.status === 'passed' ? 'ok' : x.status === 'failed' ? 'ng' : ''}">${{passed: '成功', failed: '失敗', skipped: 'スキップ'}[x.status]}</td>
      <td>${esc(x.class)}</td><td>${esc(x.name)}${x.message ? `<div class="hint">${esc(x.message)}</div>` : ''}</td><td class="num">${x.time.toFixed(3)}</td></tr>`).join('')}</table>
    <p class="note">更新するには <code>./gradlew testDebugUnitTest</code> を実行してから、このタブを開き直す。</p></div>`
    : `<div class="panel">結果がありません。<code>./gradlew testDebugUnitTest</code> を実行してください。</div>`;
}
// last, so every const/let above is initialised before a tab renders
if (['eval', 'unit', 'train', 'review'].includes(location.hash.slice(1))) showTab(location.hash.slice(1));
</script>
</body>
</html>
