<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品認識の比較</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#333842; --text:#e8eaee; --muted:#9aa1ad; --box:#39ff6a; --tag:#0b3d1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Segoe UI","Yu Gothic UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 24px; padding:10px 16px; }
  h1 { font-size:16px; margin:0; }
  label { display:flex; align-items:center; gap:8px; color:var(--muted); }
  output, #stats, #page { font-variant-numeric:tabular-nums; color:var(--text); }
  button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .pager { display:flex; align-items:center; gap:8px; }
  .heads, .grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; padding:0 8px; }
  .heads > div { padding:6px 4px; font-weight:600; font-size:13px; border-top:1px solid var(--line); }
  .heads small { display:block; color:var(--muted); font-weight:400; font-size:11px; }
  .grid { padding-top:8px; padding-bottom:16px; row-gap:12px; }
  figure { position:relative; margin:0; background:var(--panel); }
  figure .pic { position:relative; line-height:0; }
  figure img { display:block; width:100%; height:auto; }
  figure canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  figcaption { padding:2px 6px; color:var(--muted); font-size:11px; display:flex; justify-content:space-between; gap:6px; white-space:nowrap; overflow:hidden; }
  .boxed { cursor:zoom-in; }
  .empty { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; border:1px dashed var(--line); min-height:120px; }
  #notice { padding:10px 16px; background:#4a3a12; color:#ffe6a6; }
  #zoom { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #zoom.on { display:flex; }
  #zoom > div { position:relative; line-height:0; }
  #zoom img { display:block; max-width:100vw; max-height:100vh; }
  #zoom canvas { position:absolute; inset:0; width:100%; height:100%; }
  #ztitle { position:fixed; top:8px; left:12px; z-index:11; color:#fff; background:rgba(0,0,0,.6); padding:2px 10px; border-radius:4px; }
  .tabs { display:flex; gap:4px; padding:8px 16px 0; }
  .tabs button { border-radius:6px 6px 0 0; border-bottom:none; padding:6px 18px; }
  .tabs button.on { background:var(--box); color:#06210f; font-weight:600; border-color:var(--box); }
  .tools { position:sticky; top:var(--h,44px); z-index:4; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .tools input[type=search], .tools select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; }
  .tools .count { font-variant-numeric:tabular-nums; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:8px; padding:12px 16px 24px; }
  .card { position:relative; background:var(--panel); border:3px solid transparent; border-radius:6px; padding:4px; overflow:hidden; }
  .card.pick { cursor:pointer; }
  .card.on { border-color:var(--box); }
  .card.on::after { content:"✓"; position:absolute; top:2px; right:6px; color:#06210f; background:var(--box); border-radius:50%; width:22px; line-height:22px; text-align:center; font-weight:700; }
  .card .ph { height:130px; display:flex; align-items:center; justify-content:center; }
  .card .ph img { max-width:100%; max-height:130px; display:block; }
  .card .none { color:var(--muted); font-size:12px; }
  .card .t { font-size:12px; line-height:1.35; height:3.1em; overflow:hidden; margin-top:4px; }
  .card .c { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  h2 { font-size:15px; margin:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header id="top">
  <nav class="tabs">
    <button data-tab="compare">比較</button>
    <button data-tab="select">教師データの選択</button>
    <button data-tab="train">教師データ</button>
    <button data-tab="store">店モデル</button>
    <button data-tab="replay">記録の再生</button>
  </nav>
  <div id="compareHead">
  <div class="bar">
    <h1>商品認識の比較</h1>
    <span id="stats">読み込み中…</span>
    <label for="conf">信頼度の下限 <input id="conf" type="range" min="0.05" max="0.9" step="0.05" value="0.25"><output id="confv">0.25</output></label>
    <div class="pager"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></div>
  </div>
  <div id="notice" hidden></div>
  <div class="heads" id="heads"></div>
  </div>
</header>
<section id="tab-compare"><main class="grid" id="grid"></main></section>

<section id="tab-replay" hidden><iframe id="replay-frame" title="記録の再生" style="width:100%;height:calc(100vh - 50px);border:0;display:block"></iframe></section>
<section id="tab-store" hidden><iframe id="store-frame" title="店モデル" style="width:100%;height:calc(100vh - 50px);border:0;display:block"></iframe></section>
<section id="tab-select" hidden>
  <div class="tools">
    <select id="sSrc"><option value="crops">店内の切り抜き</option><option value="db">コンビニDB の分類結果</option></select>
    <input id="sQ" type="search" placeholder="商品名で絞り込み">
    <select id="sCat"><option value="">すべてのカテゴリ</option></select>
    <select id="sShow"><option value="all">すべて</option><option value="off">未選択だけ</option><option value="on">選択済みだけ</option></select>
    <label id="sRepL"><input id="sRep" type="checkbox" checked> 同じ商品名は代表1件だけ</label>
    <button id="sAll">このページを全部選ぶ</button>
    <button id="sNone">このページを全部外す</button>
    <span class="count" id="sCount"></span>
    <div class="pager"><button id="sPrev">前へ</button><span id="sPage"></span><button id="sNext">次へ</button></div>
  </div>
  <div class="cards" id="sCards"></div>
</section>

<section id="tab-train" hidden>
  <div class="tools">
    <h2>コンビニDB</h2>
    <input id="dQ" type="search" placeholder="商品名で絞り込み">
    <select id="dCat"><option value="">すべてのカテゴリ</option><option value="-">対象外</option></select>
    <select id="dChain"><option value="">すべてのチェーン</option></select>
    <label><input id="dImg" type="checkbox"> 画像があるものだけ</label>
    <span class="count" id="dCount"></span>
    <div class="pager"><button id="dPrev">前へ</button><span id="dPage"></span><button id="dNext">次へ</button></div>
  </div>
  <div class="cards" id="dCards"></div>
  <div class="tools">
    <h2>選択した教師データ</h2>
    <input id="tQ" type="search" placeholder="商品名で絞り込み">
    <span class="count" id="tCount"></span>
    <span class="count" style="color:var(--muted)">クリックで選択を外します</span>
    <div class="pager"><button id="tPrev">前へ</button><span id="tPage"></span><button id="tNext">次へ</button></div>
  </div>
  <div class="cards" id="tCards"></div>
</section>
<div id="zoom"><div><img alt=""><canvas></canvas></div></div>
<div id="ztitle" hidden></div>

<script>
const $ = s => document.querySelector(s);
const PER_PAGE = 50;
const conf = $("#conf"), grid = $("#grid"), zoom = $("#zoom");
const COLS = [
  { key:"det", title:"2. 切り出し", sub:"sku110k-2" },
  { key:"gemini", title:"Gemini", sub:"元写真の切り抜きを分類" },
  { key:"m1", title:"3-1. YOLO26n-cls", sub:"DB で学習 → 切り抜きを分類" },];
let S, page = 0;

const boxesOf = (col, im) => col.key === "det" ? im.boxes : (S.methods[col.key]?.[im.name] || []);
const kept = (col, im) => boxesOf(col, im).filter(b => b[4] >= +conf.value);

function draw(canvas, img, col, im, labels) {
  const dpr = devicePixelRatio || 1, w = img.clientWidth, h = img.clientHeight;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext("2d");
  c.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  c.strokeStyle = css.getPropertyValue("--box"); c.lineWidth = 1.25;
  c.font = `${labels ? 13 : 9}px system-ui,"Yu Gothic UI",sans-serif`; c.textBaseline = "top";
  const pad = labels ? 16 : 11;
  for (const [x0, y0, x1, y1, , cat] of kept(col, im)) {
    const x = x0 * w, y = y0 * h, bw = (x1 - x0) * w, bh = (y1 - y0) * h;
    c.strokeRect(x, y, bw, bh);
    if (!cat) continue;
    const name = S.cats[cat] || "該当なし", tw = c.measureText(name).width + 4;
    if (!labels && tw > bw) continue;  // 一覧では枠に収まる名前だけ。全部は拡大で見る
    c.fillStyle = css.getPropertyValue("--tag"); c.fillRect(x, y, tw, pad);
    c.fillStyle = "#fff"; c.fillText(name, x + 2, y + 1);
  }
}

const visible = new Set();
const io = new IntersectionObserver(es => {
  for (const e of es) { if (e.isIntersecting) { visible.add(e.target); redraw(e.target); } else visible.delete(e.target); }
}, { rootMargin:"800px 0px" });

function redraw(fig) {
  const img = fig.querySelector("img"), col = COLS[fig.dataset.c], im = S.images[fig.dataset.i], cv = fig.querySelector("canvas");
  fig.querySelector(".n").textContent = `${kept(col, im).length} 個`;
  if (img.complete && img.naturalWidth) draw(cv, img, col, im);
  else img.onload = () => draw(cv, img, col, im);
}

function cell(html, column, row) {
  const f = document.createElement("figure");
  f.innerHTML = html; f.style.gridColumn = column; f.style.gridRow = row;
  return f;
}

function render() {
  io.disconnect(); visible.clear(); grid.textContent = "";
  const last = Math.max(0, Math.ceil(S.images.length / PER_PAGE) - 1);
  page = Math.min(page, last);
  $("#page").textContent = `${page + 1} / ${last + 1}`;
  $("#prev").disabled = page === 0; $("#next").disabled = page === last;
  const frag = document.createDocumentFragment();
  S.images.slice(page * PER_PAGE, (page + 1) * PER_PAGE).forEach((im, r) => {
    const i = page * PER_PAGE + r, row = r + 1, src = `/view/${encodeURIComponent(im.name)}`;
    const ratio = im.w && im.h ? `style="aspect-ratio:${im.w}/${im.h}"` : "";
    frag.append(cell(`<div class="pic"><img loading="lazy" src="${src}" alt="" ${ratio}></div><figcaption><span>${im.name}</span></figcaption>`, 1, row));
    COLS.forEach((col, c) => {
      const column = c + 2;
      if (col.key !== "det" && !S.methods[col.key]) {
        const e = cell("未実施", column, row); e.className = "empty"; frag.append(e); return;
      }
      const f = cell(`<div class="pic"><img loading="lazy" src="${src}" alt="" ${ratio}><canvas></canvas></div><figcaption><span></span><span class="n"></span></figcaption>`, column, row);
      f.className = "boxed"; f.dataset.i = i; f.dataset.c = c;
      f.onclick = () => openZoom(col, im);
      io.observe(f); frag.append(f);
    });
  });
  grid.append(frag);
  scrollTo(0, 0);
}

function openZoom(col, im) {
  const img = zoom.querySelector("img"), cv = zoom.querySelector("canvas"), t = $("#ztitle");
  img.onload = () => draw(cv, img, col, im, true);
  img.src = `/view/${encodeURIComponent(im.name)}`;
  if (img.complete && img.naturalWidth) draw(cv, img, col, im, true);
  t.textContent = `${col.title}  ${im.name}`; t.hidden = false;
  zoom.classList.add("on");
}
const closeZoom = () => { zoom.classList.remove("on"); $("#ztitle").hidden = true; };
zoom.onclick = closeZoom;
addEventListener("keydown", e => { if (e.key === "Escape") closeZoom(); });

function stats() {
  const n = S.images.reduce((s, im) => s + kept(COLS[0], im).length, 0);
  $("#stats").textContent = `${S.images.length.toLocaleString()} 枚 / 枠 ${n.toLocaleString()} 個（1枚あたり ${(n / Math.max(S.images.length, 1)).toFixed(1)} 個）`;
}

conf.oninput = () => { $("#confv").textContent = (+conf.value).toFixed(2); stats(); visible.forEach(redraw); };
addEventListener("resize", () => visible.forEach(redraw));
$("#prev").onclick = () => { page--; render(); };
$("#next").onclick = () => { page++; render(); };

$("#heads").innerHTML = `<div>1. 店内画像<small>元の写真</small></div>` + COLS.map(c => `<div>${c.title}<small>${c.sub}</small></div>`).join("");

(async () => {
  S = await (await fetch("/api/state")).json();
  if (!S.weights) { const n = $("#notice"); n.hidden = false; n.textContent = "まだ切り出しを実行していません。products/sku26n/detect.py を実行すると緑の枠が表示されます。"; }
  stats(); render();
})();

// ------------------------------------------------------------ タブ
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const SEL_PER_PAGE = 200, DB_PER_PAGE = 100, TRAIN_PER_PAGE = 100;
let crops = null, selected = new Set(), db = null, repIds = new Set(), cropCats = [];
const sel = { page:0 }, dbs = { page:0 }, tr = { page:0 };

async function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  for (const t of ["compare", "select", "train", "store", "replay"]) $("#tab-" + t).hidden = t !== name;
  if (name === "replay" && !$("#replay-frame").src) $("#replay-frame").src = "/replay";
  if (name === "store" && !$("#store-frame").src) $("#store-frame").src = "/store";  // 開いたときに初めて読む（1 回歩かせるので）
  $("#compareHead").hidden = name !== "compare";
  document.documentElement.style.setProperty("--h", $("#top").offsetHeight + "px");
  location.hash = name;
  scrollTo(0, 0);
  if (name === "compare") visible.forEach(redraw);
  if (name === "select") { await loadCrops(); await setSource(); }
  if (name === "train") { await loadCrops(); await loadDb(); renderDb(); renderTrain(); }
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

async function loadCrops() {
  if (crops) return;
  const d = await (await fetch("/api/crops")).json();
  crops = d.crops; selected = new Set(d.selected);
  const firstOfName = new Map();  // 同じ商品名（表記ゆれを除く）の最初の 1 件を代表にする
  for (const r of crops) { const k = r[1].normalize("NFKC").replace(/\s/g, "").toLowerCase(); if (!firstOfName.has(k)) firstOfName.set(k, r[0]); }
  repIds = new Set(firstOfName.values());
  cropCats = [...new Set(crops.map(r => r[2]))].sort();
}

/** 教師データの選択タブに出すデータ（店内の切り抜き / コンビニDB の分類結果）を切り替える。コンビニDB は見るだけ */
async function setSource() {
  const isDb = $("#sSrc").value === "db";
  for (const id of ["#sShow", "#sRepL", "#sAll", "#sNone"]) $(id).hidden = isDb;
  if (isDb) await loadDb();
  const options = isDb ? Object.entries(S.cats).filter(([k]) => k !== "NP").map(([k, v]) => `<option value="${k}">${k} ${esc(v)}</option>`) : cropCats.map(c => `<option>${esc(c)}</option>`);
  $("#sCat").innerHTML = `<option value="">すべてのカテゴリ</option>` + options.join("");
  renderSelect();
}

async function loadDb() {
  db = await (await fetch("/api/konbinidb")).json();
  if ($("#dChain").options.length > 1) return;
  const chains = [...new Set(db.items.map(r => r[2]).filter(Boolean))].sort();
  $("#dChain").insertAdjacentHTML("beforeend", chains.map(c => `<option>${esc(c)}</option>`).join(""));
  $("#dCat").insertAdjacentHTML("beforeend", Object.entries(S.cats).filter(([k]) => k !== "NP").map(([k, v]) => `<option value="${k}">${k} ${esc(v)}</option>`).join(""));
}

function pager(prefix, state, n, per) {
  const last = Math.max(0, Math.ceil(n / per) - 1);
  state.page = Math.min(state.page, last);
  $(`#${prefix}Page`).textContent = `${state.page + 1} / ${last + 1}`;
  $(`#${prefix}Prev`).disabled = state.page === 0;
  $(`#${prefix}Next`).disabled = state.page === last;
}

async function setSelected(ids, on) {
  const before = new Set(selected);
  ids.forEach(id => on ? selected.add(id) : selected.delete(id));
  const r = await fetch("/api/select", { method:"POST", body:JSON.stringify({ ids, on }) });
  if (!r.ok) { selected = before; alert("保存できませんでした"); renderSelect(); }
}

function cropCard(r, cls) {
  return `<div class="card pick ${cls}" data-id="${esc(r[0])}"><div class="ph"><img loading="lazy" src="/crop/${encodeURIComponent(r[0])}.jpg" alt=""></div>` +
    `<div class="t" title="${esc(r[1])}">${esc(r[1])}</div><div class="c">${esc(r[2])}</div></div>`;
}

let selRows = [];
function dbCard(r) {
  return `<div class="card"><div class="ph">${r[5] ? `<img loading="lazy" src="/db/${r[0]}.webp" alt="">` : '<span class="none">画像未取得</span>'}</div>` +
    `<div class="t" title="${esc(r[1])}">${esc(r[1])}</div><div class="c">${esc(r[3] ? S.cats[r[3]] : "対象外")}・${esc(r[2] || "ナチュラルローソン")}</div></div>`;
}

function renderSelect() {
  if ($("#sSrc").value === "db") {
    const text = $("#sQ").value.trim(), code = $("#sCat").value;
    const rows = db.items.filter(r => (!text || r[1].includes(text)) && (!code || r[3] === code));
    pager("s", sel, rows.length, SEL_PER_PAGE);
    $("#sCount").textContent = `${rows.length.toLocaleString()} 件（全 ${db.items.length.toLocaleString()} 件、画像 ${db.images.toLocaleString()} 枚）`;
    $("#sCards").innerHTML = rows.slice(sel.page * SEL_PER_PAGE, (sel.page + 1) * SEL_PER_PAGE).map(dbCard).join("");
    return;
  }
  const q = $("#sQ").value.trim(), cat = $("#sCat").value, show = $("#sShow").value, rep = $("#sRep").checked;
  const all = crops.filter(r => (!rep || repIds.has(r[0])) && (!q || r[1].includes(q)) && (!cat || r[2] === cat) && (show === "all" || selected.has(r[0]) === (show === "on")));
  pager("s", sel, all.length, SEL_PER_PAGE);
  selRows = all.slice(sel.page * SEL_PER_PAGE, (sel.page + 1) * SEL_PER_PAGE);
  $("#sCount").textContent = `${all.length.toLocaleString()} 個を表示 / 選択済み ${selected.size.toLocaleString()} 個`;
  $("#sCards").innerHTML = selRows.map(r => cropCard(r, selected.has(r[0]) ? "on" : "")).join("");
}

$("#sSrc").onchange = () => { sel.page = 0; setSource(); };
$("#sCards").onclick = e => {
  const c = e.target.closest(".card.pick"); if (!c) return;
  const on = !selected.has(c.dataset.id);
  c.classList.toggle("on", on);
  setSelected([c.dataset.id], on);
  $("#sCount").textContent = $("#sCount").textContent.replace(/選択済み [\d,]+ 個/, `選択済み ${selected.size.toLocaleString()} 個`);
};
const pageAll = on => { setSelected(selRows.map(r => r[0]), on); renderSelect(); };
$("#sAll").onclick = () => pageAll(true);
$("#sNone").onclick = () => pageAll(false);

function renderDb() {
  const q = $("#dQ").value.trim(), cat = $("#dCat").value, chain = $("#dChain").value, img = $("#dImg").checked;
  const all = db.items.filter(r => (!q || r[1].includes(q)) && (!cat || (cat === "-" ? !r[3] : r[3] === cat)) && (!chain || r[2] === chain) && (!img || r[5]));
  pager("d", dbs, all.length, DB_PER_PAGE);
  $("#dCount").textContent = `${all.length.toLocaleString()} 件（全 ${db.items.length.toLocaleString()} 件、画像 ${db.images.toLocaleString()} 枚）`;
  $("#dCards").innerHTML = all.slice(dbs.page * DB_PER_PAGE, (dbs.page + 1) * DB_PER_PAGE).map(dbCard).join("");
}

function renderTrain() {
  const q = $("#tQ").value.trim();
  const all = crops.filter(r => selected.has(r[0]) && (!q || r[1].includes(q)));
  pager("t", tr, all.length, TRAIN_PER_PAGE);
  $("#tCount").textContent = `${all.length.toLocaleString()} 個`;
  $("#tCards").innerHTML = all.length ? all.slice(tr.page * TRAIN_PER_PAGE, (tr.page + 1) * TRAIN_PER_PAGE).map(r => cropCard(r, "on")).join("")
    : '<span class="none">まだ選択されていません。「教師データの選択」タブで選んでください。</span>';
}

$("#tCards").onclick = async e => {
  const c = e.target.closest(".card"); if (!c) return;
  await setSelected([c.dataset.id], false);
  renderTrain();
};

const bind = (ids, state, render) => ids.forEach(id => $(id).oninput = () => { state.page = 0; render(); });
bind(["#sQ", "#sCat", "#sShow", "#sRep"], sel, renderSelect);
bind(["#dQ", "#dCat", "#dChain", "#dImg"], dbs, renderDb);
bind(["#tQ"], tr, renderTrain);
for (const [p, state, render] of [["s", sel, renderSelect], ["d", dbs, renderDb], ["t", tr, renderTrain]]) {
  $(`#${p}Prev`).onclick = () => { state.page--; render(); };
  $(`#${p}Next`).onclick = () => { state.page++; render(); };
}

(function waitForState() {  // カテゴリ名（S.cats）が読めてからタブを開く

})();
