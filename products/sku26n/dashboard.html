<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品認識の比較</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#333842; --text:#e8eaee; --muted:#9aa1ad; --box:#39ff6a; --tag:#0b3d1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,"Segoe UI","Yu Gothic UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 24px; padding:10px 16px; }
  h1 { font-size:16px; margin:0; }
  label { display:flex; align-items:center; gap:8px; color:var(--muted); }
  output, #stats, #page { font-variant-numeric:tabular-nums; color:var(--text); }
  button { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 12px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  .pager { display:flex; align-items:center; gap:8px; }
  .heads, .grid { display:grid; grid-template-columns:repeat(9,minmax(0,1fr)); min-width:2520px; gap:6px; padding:0 8px; }
  .heads > div { padding:6px 4px; font-weight:600; font-size:13px; border-top:1px solid var(--line); }
  .heads small { display:block; color:var(--muted); font-weight:400; font-size:11px; }
  .grid { padding-top:8px; padding-bottom:16px; row-gap:12px; }
  figure { position:relative; margin:0; background:var(--panel); }
  figure .pic { position:relative; line-height:0; }
  figure img { display:block; width:100%; height:auto; }
  figure canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  figcaption { padding:2px 6px; color:var(--muted); font-size:11px; display:flex; justify-content:space-between; gap:6px; white-space:nowrap; overflow:hidden; }
  .boxed { cursor:zoom-in; }
  .empty { display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; border:1px dashed var(--line); min-height:120px; }
  #notice { padding:10px 16px; background:#4a3a12; color:#ffe6a6; }
  #zoom { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; cursor:zoom-out; }
  #zoom.on { display:flex; }
  #zoom > div { position:relative; line-height:0; }
  #zoom img { display:block; max-width:100vw; max-height:100vh; }
  #zoom canvas { position:absolute; inset:0; width:100%; height:100%; }
  #tip { position:fixed; z-index:20; pointer-events:none; background:#000; color:#fff; border:1px solid var(--box); border-radius:6px; padding:6px 10px; font-size:13px; line-height:1.5; min-width:220px; }
  #tip div { display:flex; justify-content:space-between; gap:16px; }
  #ztitle { position:fixed; top:8px; left:12px; z-index:11; color:#fff; background:rgba(0,0,0,.6); padding:2px 10px; border-radius:4px; }
  .tabs { display:flex; gap:4px; padding:8px 16px 0; }
  .tabs button { border-radius:6px 6px 0 0; border-bottom:none; padding:6px 18px; }
  .tabs button.on { background:var(--box); color:#06210f; font-weight:600; border-color:var(--box); }
  .tools { position:sticky; top:var(--h,44px); z-index:4; display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  .tools input[type=search], .tools select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 8px; font:inherit; }
  .tools .count { font-variant-numeric:tabular-nums; }
  .confirmed-list { max-width:1200px; margin:auto; padding:12px 16px 32px; }
  .confirmed-row { display:grid; grid-template-columns:96px minmax(0,1fr); gap:16px; align-items:center; padding:10px; border-bottom:1px solid var(--line); }
  .confirmed-row img { width:96px; height:96px; object-fit:contain; background:var(--panel); border-radius:4px; }
  .confirmed-row .category { color:var(--box); font-weight:600; }
  .confirmed-row .product { font-size:15px; overflow-wrap:anywhere; }
  .confirmed-row .source { color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .confirmed-empty { padding:32px; color:var(--muted); text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header id="top">
  <nav class="tabs">
    <button data-tab="compare">比較</button>
    <button data-tab="confirmed">Gemini 確定アノテーション</button>
  </nav>
  <div id="compareHead">
  <div class="bar">
    <h1>商品認識の比較</h1>
    <span id="stats">読み込み中…</span>
    <label><input id="gemOnly" type="checkbox"> Gemini 判定済みの写真だけ</label>
    <label for="conf">検出信頼度の下限 <input id="conf" type="range" min="0.05" max="0.9" step="0.05" value="0.25"><output id="confv">0.25</output></label>
    <div class="pager"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></div>
  </div>
  <div id="notice" hidden></div>
  <div class="heads" id="heads"></div>
  </div>
</header>
<section id="tab-compare"><main class="grid" id="grid"></main></section>

<section id="tab-confirmed" hidden>
  <div class="tools">
    <input id="gQ" type="search" placeholder="社名・商品名・写真名で検索" aria-label="確定アノテーションを検索">
    <select id="gCat" aria-label="カテゴリで絞り込み"><option value="">すべてのカテゴリ</option></select>
    <button id="gRefresh" type="button">更新</button>
    <span class="count" id="gCount"></span>
    <div class="pager"><button id="gPrev" type="button">前へ</button><span id="gPage"></span><button id="gNext" type="button">次へ</button></div>
  </div>
  <div class="confirmed-list" id="gRows"></div>
</section>

<div id="zoom"><div><img alt=""><canvas></canvas></div></div>
<div id="ztitle" hidden></div>
<div id="tip" hidden></div>

<script>
const $ = s => document.querySelector(s);
const PER_PAGE = 50;
const conf = $("#conf"), grid = $("#grid"), zoom = $("#zoom");
const COLS = [
  { key:"det", title:"2. 切り出し", sub:"sku110k-2" },
  { key:"gemini", title:"Gemini（進行中）", sub:"現在の判定結果。カーソルで社名・商品名" },
  { key:"clip_gem", title:"2段 MobileCLIP", sub:"sku110k-2の枠 + Gemini確定ラベルで学習した分類" },
  { key:"m1_gem", title:"2段 YOLO26n-cls", sub:"sku110k-2の枠 + Gemini確定ラベルで学習した分類" },
  { key:"trained", title:"A. 先行モデル", sub:"旧チェックポイントからの再学習（参考）" },
  { key:"b", title:"B. 122カテゴリ直接学習", sub:"元の重み + 確定ラベル。不確定領域は損失から除外" },
  { key:"b_lr1e3", title:"B2. 学習率1e-3", sub:"Bと同じデータで学習率だけ変更（AdamW 1e-3）" },
  { key:"c", title:"C. 30グループ直接学習", sub:"Bと同じ画像・重み・無視領域。カテゴリを統合" },];
let S, page = 0;

const boxesOf = (col, im) => col.key === "det" ? im.boxes : (S.methods[col.key]?.[im.name] || []);
const kept = (col, im) => boxesOf(col, im).filter(b => b[4] >= +conf.value);

function draw(canvas, img, col, im, labels) {
  const dpr = devicePixelRatio || 1, w = img.clientWidth, h = img.clientHeight;
  if (!w || !h) return;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const c = canvas.getContext("2d");
  c.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  c.strokeStyle = css.getPropertyValue("--box"); c.lineWidth = 1.25;
  c.font = `${labels ? 13 : 9}px system-ui,"Yu Gothic UI",sans-serif`; c.textBaseline = "top";
  const pad = labels ? 16 : 11;
  for (const [x0, y0, x1, y1, , cat, classScore] of kept(col, im)) {
    const x = x0 * w, y = y0 * h, bw = (x1 - x0) * w, bh = (y1 - y0) * h;
    const flagged = col.key === "gemini" && classScore === true;  // 読めないのにラベルが付いた（目視で確認）
    c.strokeStyle = flagged ? "#ff3b30" : css.getPropertyValue("--box"); c.lineWidth = flagged ? 3 : 1.25;
    c.strokeRect(x, y, bw, bh);
    if (!cat) continue;
    const name = (flagged ? "要確認 " : "") + (S.cats[cat] || cat || "該当なし") + (labels && col.key === "m1" && classScore != null ? ` ${Math.round(classScore * 100)}%` : "");
    const tw = c.measureText(name).width + 4;
    if (!labels && tw > bw) continue;  // 一覧では枠に収まる名前だけ。全部は拡大で見る
    c.fillStyle = css.getPropertyValue("--tag"); c.fillRect(x, y, tw, pad);
    c.fillStyle = "#fff"; c.fillText(name, x + 2, y + 1);
  }
}

const visible = new Set();
const io = new IntersectionObserver(es => {
  for (const e of es) { if (e.isIntersecting) { visible.add(e.target); redraw(e.target); } else visible.delete(e.target); }
}, { rootMargin:"800px 0px" });

function redraw(fig) {
  const img = fig.querySelector("img"), col = COLS[fig.dataset.c], im = S.images[fig.dataset.i], cv = fig.querySelector("canvas");
  fig.querySelector(".n").textContent = `${kept(col, im).length} 個`;
  if (img.complete && img.naturalWidth) draw(cv, img, col, im);
  else img.onload = () => draw(cv, img, col, im);
}

function cell(html, column, row) {
  const f = document.createElement("figure");
  f.innerHTML = html; f.style.gridColumn = column; f.style.gridRow = row;
  return f;
}

function render() {
  io.disconnect(); visible.clear(); grid.textContent = "";
  const shown = $("#gemOnly").checked ? S.images.filter(im => S.methods.gemini?.[im.name]) : S.images;
  const last = Math.max(0, Math.ceil(shown.length / PER_PAGE) - 1);
  page = Math.min(page, last);
  $("#page").textContent = `${page + 1} / ${last + 1}`;
  $("#prev").disabled = page === 0; $("#next").disabled = page === last;
  const frag = document.createDocumentFragment();
  shown.slice(page * PER_PAGE, (page + 1) * PER_PAGE).forEach((im, r) => {
    const i = S.images.indexOf(im), row = r + 1, src = `/view/${encodeURIComponent(im.name)}`;
    const ratio = im.w && im.h ? `style="aspect-ratio:${im.w}/${im.h}"` : "";
    frag.append(cell(`<div class="pic"><img loading="lazy" src="${src}" alt="" ${ratio}></div><figcaption><span>${im.name}</span></figcaption>`, 1, row));
    COLS.forEach((col, c) => {
      const column = c + 2;
      if (col.key !== "det" && !S.methods[col.key]) {
        const e = cell("未実施", column, row); e.className = "empty"; frag.append(e); return;
      }
      const f = cell(`<div class="pic"><img loading="lazy" src="${src}" alt="" ${ratio}><canvas></canvas></div><figcaption><span></span><span class="n"></span></figcaption>`, column, row);
      f.className = "boxed"; f.dataset.i = i; f.dataset.c = c;
      f.onclick = () => openZoom(col, im);
      io.observe(f); frag.append(f);
    });
  });
  grid.append(frag);
  scrollTo(0, 0);
}

function openZoom(col, im) {
  const img = zoom.querySelector("img"), cv = zoom.querySelector("canvas"), t = $("#ztitle");
  img.onload = () => draw(cv, img, col, im, true);
  img.src = `/view/${encodeURIComponent(im.name)}`;
  if (img.complete && img.naturalWidth) draw(cv, img, col, im, true);
  t.textContent = `${col.title}  ${im.name}`; t.hidden = false;
  zoomCol = col; zoomIm = im;
  zoom.classList.add("on");
}
const closeZoom = () => { zoom.classList.remove("on"); $("#ztitle").hidden = true; zoomCol = zoomIm = null; hideTip(); };
zoom.onclick = closeZoom;
addEventListener("keydown", e => { if (e.key === "Escape") closeZoom(); });

// ------------------------------------------------------------ 枠にカーソルを合わせると Top-5 を出す
let zoomCol = null, zoomIm = null, hoverToken = 0;
const top5Cache = new Map();
function top5Of(key, name) {
  const k = `${key}/${encodeURIComponent(name)}`;
  if (!top5Cache.has(k)) top5Cache.set(k, fetch(`/api/top5/${k}`).then(r => r.ok ? r.json() : null));
  return top5Cache.get(k);
}
function boxAt(col, im, x, y) {  // カーソルの下の枠のうち、いちばん小さいもの（番号は元の枠の順）
  let best = -1, area = Infinity;
  boxesOf(col, im).forEach((b, i) => {
    if (b[4] < +conf.value || x < b[0] || x > b[2] || y < b[1] || y > b[3]) return;
    const a = (b[2] - b[0]) * (b[3] - b[1]);
    if (a < area) { area = a; best = i; }
  });
  return best;
}
function hideTip() { hoverToken++; $("#tip").hidden = true; }
async function showTip(e, img, col, im) {
  if (col.key === "det") return hideTip();
  const r = img.getBoundingClientRect(), i = boxAt(col, im, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
  if (i < 0) return hideTip();
  const token = ++hoverToken, data = (col.key === "gemini" || ["m1_gem", "clip_gem", "trained", "b", "b_lr1e3", "c"].includes(col.key)) ? null : await top5Of(col.key, im.name);
  if (token !== hoverToken) return;
  const tip = $("#tip"), top = data?.[i], box = boxesOf(col, im)[i];
  tip.innerHTML = col.key === "gemini" ? `<b>${esc(col.title)}</b><div><span>${esc(S.cats[box[5]] || box[5])}</span></div>${box[8] ? `<div><span>${esc(box[7] || "")} ${esc(box[8])}</span></div>` : ""}${box[6] === true ? "<div>読めないのにラベルが付いた（要確認）</div>" : ""}` : top ? `<b>${esc(col.title)}</b>` + top.map(([c, p], n) => `<div><span>${n + 1}. ${esc(S.cats[c] || c)}</span><span>${(p * 100).toFixed(1)}%</span></div>`).join("")
    : "Top-5 はまだありません";
  if (["m1_gem", "clip_gem", "trained", "b", "b_lr1e3", "c"].includes(col.key)) tip.innerHTML = `<b>${esc(col.title)}</b><div><span>${esc(S.cats[box[5]] || box[5])}</span><span>${((box[6] ?? box[4]) * 100).toFixed(1)}%</span></div>`;
  tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + "px";
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + "px";
}
grid.addEventListener("mousemove", e => {
  const f = e.target.closest("figure.boxed");
  f ? showTip(e, f.querySelector("img"), COLS[f.dataset.c], S.images[f.dataset.i]) : hideTip();
});
grid.addEventListener("mouseleave", hideTip);
zoom.addEventListener("mousemove", e => { if (zoomCol) showTip(e, zoom.querySelector("img"), zoomCol, zoomIm); });
$("#gemOnly").onchange = () => { page = 0; render(); };

function stats() {
  const n = S.images.reduce((s, im) => s + kept(COLS[0], im).length, 0);
  $("#stats").textContent = `${S.images.length.toLocaleString()} 枚 / 枠 ${n.toLocaleString()} 個（1枚あたり ${(n / Math.max(S.images.length, 1)).toFixed(1)} 個）`;
}

conf.oninput = () => { $("#confv").textContent = (+conf.value).toFixed(2); stats(); visible.forEach(redraw); };
addEventListener("resize", () => visible.forEach(redraw));
$("#prev").onclick = () => { page--; render(); };
$("#next").onclick = () => { page++; render(); };

function renderHeads() {
  $("#heads").innerHTML = `<div>1. 店内画像<small>元の写真</small></div>` + COLS.map(c => {
    const run = S?.training?.[c.key];
    const metrics = run ? ` · ${run.photos}枚で学習 · 検証 mAP50 ${(run.map50 * 100).toFixed(1)}% / 再現率 ${(run.recall * 100).toFixed(1)}%` : "";
    return `<div>${c.title}<small>${c.sub}${metrics}</small></div>`;
  }).join("");
}
renderHeads();

(async () => {
  S = await (await fetch("/api/state")).json();
  renderHeads();
  if (!S.weights) { const n = $("#notice"); n.hidden = false; n.textContent = "まだ切り出しを実行していません。products/sku26n/detect.py を実行すると緑の枠が表示されます。"; }
  stats(); showTab(location.hash === "#confirmed" ? "confirmed" : "compare");
})();

// ------------------------------------------------------------ タブ
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
let confirmedPage = 0, confirmedRequest = 0, confirmedTimer;

async function showTab(name) {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  $("#tab-compare").hidden = name !== "compare";
  $("#tab-confirmed").hidden = name !== "confirmed";
  $("#compareHead").hidden = name !== "compare";
  document.documentElement.style.setProperty("--h", $("#top").offsetHeight + "px");
  location.hash = name;
  closeZoom();
  scrollTo(0, 0);
  if (name === "compare") render();
  else {
    if ($("#gCat").options.length === 1) {
      $("#gCat").insertAdjacentHTML("beforeend", Object.entries(S.cats)
        .filter(([code]) => /^\d{3}$/.test(code))
        .map(([code, label]) => `<option value="${code}">${code} ${esc(label)}</option>`).join(""));
    }
    loadConfirmed();
  }
}

async function loadConfirmed() {
  const request = ++confirmedRequest;
  const params = new URLSearchParams({page: confirmedPage, q: $("#gQ").value.trim(), cat: $("#gCat").value});
  $("#gCount").textContent = "読み込み中…";
  try {
    const response = await fetch(`/api/confirmed?${params}`, {cache:"no-store"});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (request !== confirmedRequest) return;
    confirmedPage = data.page;
    $("#gCount").textContent = `${data.total.toLocaleString()} 件の確定判定`;
    $("#gPage").textContent = `${data.page + 1} / ${data.pages}`;
    $("#gPrev").disabled = data.page === 0;
    $("#gNext").disabled = data.page + 1 === data.pages;
    $("#gRows").innerHTML = data.rows.length ? data.rows.map(([file, box, cat, maker, product, score]) => {
      const imageUrl = `/api/confirmed/crop/${encodeURIComponent(file)}/${box}.jpg`;
      const sourceUrl = `/view/${encodeURIComponent(file)}`;
      return `<div class="confirmed-row"><a href="${esc(sourceUrl)}" target="_blank" rel="noopener" title="元写真を開く"><img loading="lazy" src="${esc(imageUrl)}" alt="${esc(cat)} の切り抜き"></a>` +
        `<div><div class="category">${esc(cat)} ${esc(S.cats[cat] || "")}</div>` +
        `<div class="product">${esc([maker, product].filter(Boolean).join(" ") || "名称なし")}</div>` +
        `<div class="source">${esc(file)} · 枠 #${box} · 元検出 ${(score * 100).toFixed(1)}%</div></div></div>`;
    }).join("") : '<div class="confirmed-empty">条件に合う確定判定はありません。</div>';
  } catch (error) {
    if (request === confirmedRequest) {
      $("#gCount").textContent = "読み込みに失敗しました";
      $("#gRows").innerHTML = `<div class="confirmed-empty">${esc(error.message)}</div>`;
    }
  }
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
$("#gQ").oninput = () => { confirmedPage = 0; clearTimeout(confirmedTimer); confirmedTimer = setTimeout(loadConfirmed, 250); };
$("#gCat").onchange = () => { confirmedPage = 0; loadConfirmed(); };
$("#gRefresh").onclick = loadConfirmed;
$("#gPrev").onclick = () => { confirmedPage--; loadConfirmed(); scrollTo(0, 0); };
$("#gNext").onclick = () => { confirmedPage++; loadConfirmed(); scrollTo(0, 0); };
</script>
</body>
</html>
