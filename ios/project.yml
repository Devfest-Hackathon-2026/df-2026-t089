# XcodeGen の設定。`xcodegen generate` で ShelfSight.xcodeproj を作る（.xcodeproj はコミットしない）。
name: ShelfSight
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
packages:
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: "1.20.0"
targets:
  ShelfSight:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: ShelfSight
      # モデルは Android 版と同じもの（app/src/main/assets/products）を、アプリの products/ に入れる。
      # MobileCLIP だけは、入力を 1 枚に固定した iOS 用のもの（tools/export_ios_mobileclip.py で作る）。
      # Android 版のものは枚数が決まっておらず Core ML に渡せないので、CPU で動いて作業用のメモリが増え続けていた。
      # gallery.bin は iOS 版では使わない
      - path: ../app/src/main/assets/products/detector.onnx
        buildPhase:
          copyFiles:
            destination: resources
            subpath: products
      - path: ../app/src/main/assets/products/gallery.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: products
      - path: ../app/src/main/assets/products/category_head.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: products
      - path: ../app/src/main/assets/products/category_head.bin
        buildPhase:
          copyFiles:
            destination: resources
            subpath: products
      - path: Models/mobileclip_s0.onnx
        buildPhase:
          copyFiles:
            destination: resources
            subpath: products
      # 商品のジャンル → 7 つのまとまり（場違いな商品を外すのに使う）。歩行中の判別のモデルは入れない
      - path: ../app/src/main/assets/coarse/categories.json
        buildPhase: resources
      # 店のテーマ、人の検出のモデル、頭部インパルス応答も Android 版と同じもの
      - path: ../app/src/main/assets/store_themes.json
        buildPhase: resources
      - path: ../app/src/main/assets/person
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/hrtf
        type: folder
        buildPhase: resources
    dependencies:
      # onnxruntime.xcframework の中身は静的ライブラリなので、リンクするだけでアプリに入れない
      # （入れると App Store Connect が ITMS-90208・90035 で断る）
      - package: OnnxRuntime
        product: onnxruntime
        embed: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: ShelfSight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSCameraUsageDescription: 棚と商品、近づいてくる人を見分けるためにカメラを使います。
        NSMicrophoneUsageDescription: 2回たたいたあとの質問を聞き取るためにマイクを使います。
        NSSpeechRecognitionUsageDescription: 質問を文字にするために音声認識を使います。
        NSLocationWhenInUseUsageDescription: いる店を調べて、その店の地図を読み込むために位置情報を使います。
        # 記録（records/）を「ファイル」アプリから取り出せるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # 標準の HTTPS しか使わない（TestFlight へ上げるときの輸出規制の質問を省く）
        ITSAppUsesNonExemptEncryption: false
        # ビルドのときに Config.xcconfig / Secrets.xcconfig から入る設定
        GEMINI_API_KEY: $(GEMINI_API_KEY)
        GEMINI_MODELS: $(GEMINI_MODELS)
        GEMINI_FAST_MODEL: $(GEMINI_FAST_MODEL)
        CLOUD_VISION_API_KEY: $(CLOUD_VISION_API_KEY)
        GCP_API_KEY: $(GCP_API_KEY)
        BACKEND_URL: $(BACKEND_URL)
        BACKEND_API_KEY: $(BACKEND_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SHELFSIGHT_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(SHELFSIGHT_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_BITCODE: false
  # カメラのいらない推定の処理だけを、Android 版と同じデータで確かめる（アプリを起動しない）
  ShelfSightTests:
    type: bundle.unit-test
    platform: iOS
    scheme:
      testTargets: [ShelfSightTests]
    sources:
      - path: ShelfSightTests
      - path: ShelfSight/Assist/StoreModel.swift
      - path: ShelfSight/Assist/MirrorCorrection.swift
      - path: ShelfSight/Assist/MultiLineRansac.swift
      - path: ShelfSight/Assist/NeighborConfidence.swift
      - path: ShelfSight/Model/Detection.swift
      - path: ShelfSight/Util/Sync.swift
      - path: ../app/src/test/resources/store_model_trace.tsv
        buildPhase: resources
      - path: ../app/src/main/assets/store_themes.json
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: jp.devfest.shelfsight.tests
