# 署名なしで iOS 版をビルドし、推定のテストを動かす。シークレットはいらない。
name: iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "app/src/main/assets/**"
      - "app/src/test/resources/store_model_trace.tsv"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode を選ぶ
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode のプロジェクトを作る
        working-directory: ios
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: アプリをビルドする
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project ShelfSight.xcodeproj \
            -scheme ShelfSight \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log" || { grep -B2 -A8 "error:" "$RUNNER_TEMP/build.log" | tail -200; exit 1; }

      - name: 推定のテストを動かす
        working-directory: ios
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcodebuild test \
            -project ShelfSight.xcodeproj \
            -scheme ShelfSightTests \
            -destination "id=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd-test" \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/test.log" | grep -E "error:|Test Case .*(passed|failed)|XCTAssert|TEST (SUCCEEDED|FAILED)|Executed " || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test.log"

      - name: ビルドのログを残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore
